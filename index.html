@media screen and (max-width: 1100px) {

    /* 1. Create a stable relative box base with top padding for the logo lane */

        display: block !important;
        position: relative !important;   /* Creates the coordinate map anchor point */
        padding: 55px 16px 16px 16px !important; /* 55px top padding creates a dedicated clean lane for the logo */

    }

    /* 2. Pull Column 2 (Logo) completely out of the text row stream and pin it at the top left */

        display: block !important;
        position: absolute !important;   /* Lifts it out of the text sentence completely */

    table tbody tr:not(:has([colspan])) td:nth-child(2) img {
        width: 35px !important;
        height: auto !important;
        display: block !important;
        object-fit: contain !important;
    }

    /* 3. THE RECOMBINATION FIX: Because Column 2 is lifted out, Columns 1, 3, and 4 smash together natively */
    table tbody tr:not(:has([colspan])) td:nth-child(1),
    table tbody tr:not(:has([colspan])) td:nth-child(3),

    function parseCSVText(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;

        dataset = [];

        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const cells = [];
            let current = '';
            let insideQuotes = false;
            
            for (let c = 0; c < line.length; c++) {
                let char = line.charAt(c);
                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === ',' && !insideQuotes) {
                    cells.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            cells.push(current.trim().replace(/^"|"$/g, ''));

            if (cells.length >= 7) {
                const rowDay = cells.at(0);
                const rowDate = cells.at(1);
                const rowTime = cells.at(2);
                const rowComp = cells.at(3);
                const rowEvent = cells.at(4);
                const rowDiv = cells.at(5);
                const rowRound = cells.at(6);
                const rowComment = cells.length >= 8 ? cells.at(7) : '';
				const rowWarning = cells.length >= 9 ? cells.at(8) : '';

                // Create a unique time slot fingerprint string key
                const slotKey = rowDate + '|' + rowTime + '|' + rowComp + '|' + rowEvent + '|' + rowRound;

                // Check if this time slot already exists in our dataset array list
                const existingEntry = dataset.find(item => item.SlotKey === slotKey);

                if (existingEntry) {
                    // 1. Safely add the concurrent division tag to the horizontal array list if it's missing
                    if (!existingEntry.Divisions.includes(rowDiv)) {
                        existingEntry.Divisions.push(rowDiv);
                    }
                    
                    // 2. STABLE CONDITIONAL MULTI-COMMENT PREFIX ENGINE
                    if (rowComment && rowComment.trim() !== "") {
                        // Generate a clean mini text token lookup matching your strict legend categories
                        let cleanDiv = rowDiv.trim().toLowerCase();
                        let miniLabel = rowDiv.trim();
                        
                        if (cleanDiv === 'open') miniLabel = 'O';
                        else if (cleanDiv === 'men' || cleanDiv === 'mens' || cleanDiv === "men's") miniLabel = 'M';
                        else if (cleanDiv === 'women' || cleanDiv === 'womens' || cleanDiv === "women's") miniLabel = 'W';
                        else if (cleanDiv.includes('50')) miniLabel = '50+';
                        else if (cleanDiv.includes('60')) miniLabel = '60+';
                        else if (cleanDiv.includes('23') || cleanDiv.includes('u23')) miniLabel = 'U23';
                        else if (cleanDiv.includes('master')) miniLabel = 'Mas';
                        else if (cleanDiv.includes('cup')) miniLabel = 'Cup';

                        const formattedIncomingComment = "[" + miniLabel + "] " + rowComment.trim();

                        if (!existingEntry.Comment || existingEntry.Comment.trim() === "") {
                            // If the row had no comment yet, save this formatted entry
                            existingEntry.Comment = formattedIncomingComment;
                        } else {
                            // If a comment exists, ensure the FIRST entry is also labeled retroactively
                            if (!existingEntry.Comment.startsWith("[")) {
                                // Look up the very first division badge saved in the array stack row
                                let baseDiv = existingEntry.Divisions.at(0) || '';
                                let baseCleanDiv = baseDiv.trim().toLowerCase();
                                let baseMiniLabel = baseDiv.trim();

                                if (baseCleanDiv === 'open') baseMiniLabel = 'O';
                                else if (baseCleanDiv === 'men' || baseCleanDiv === 'mens' || baseCleanDiv === "men's") baseMiniLabel = 'M';
                                else if (baseCleanDiv === 'women' || baseCleanDiv === 'womens' || baseCleanDiv === "women's") baseMiniLabel = 'W';
                                else if (baseCleanDiv.includes('50')) baseMiniLabel = '50+';
                                else if (baseCleanDiv.includes('60')) baseMiniLabel = '60+';
                                else if (baseCleanDiv.includes('23') || baseCleanDiv.includes('u23')) baseMiniLabel = 'U23';
                                else if (baseCleanDiv.includes('master')) baseMiniLabel = 'Mas';
                                else if (baseCleanDiv.includes('cup')) baseMiniLabel = 'Cup';

                                existingEntry.Comment = "[" + baseMiniLabel + "] " + existingEntry.Comment.trim();
                            }

                            // Append the new message only if it isn't an exact duplicate line string
                            if (!existingEntry.Comment.includes(formattedIncomingComment)) {
                                existingEntry.Comment += " / " + formattedIncomingComment;
                            }
                        }
                    }
					
					 if (rowWarning && rowWarning.trim() !== "") {
                        // Generate a clean mini text token lookup matching your strict legend categories
                        let cleanDiv = rowDiv.trim().toLowerCase();
                        let miniLabel = rowDiv.trim();
                        
                        if (cleanDiv === 'open') miniLabel = 'O';
                        else if (cleanDiv === 'men' || cleanDiv === 'mens' || cleanDiv === "men's") miniLabel = 'M';
                        else if (cleanDiv === 'women' || cleanDiv === 'womens' || cleanDiv === "women's") miniLabel = 'W';
                        else if (cleanDiv.includes('50')) miniLabel = '50+';
                        else if (cleanDiv.includes('60')) miniLabel = '60+';
                        else if (cleanDiv.includes('23') || cleanDiv.includes('u23')) miniLabel = 'U23';
                        else if (cleanDiv.includes('master')) miniLabel = 'Mas';
                        else if (cleanDiv.includes('cup')) miniLabel = 'Cup';

                        const formattedIncomingWarning = "[" + miniLabel + "] " + rowWarning.trim();

                        if (!existingEntry.Warning || existingEntry.Warning.trim() === "") {
                            // If the row had no Warning yet, save this formatted entry
                            existingEntry.Warning = formattedIncomingWarning;
                        } else {
                            // If a Warning exists, ensure the FIRST entry is also labeled retroactively
                            if (!existingEntry.Warning.startsWith("[")) {
                                // Look up the very first division badge saved in the array stack row
                                let baseDiv = existingEntry.Divisions.at(0) || '';
                                let baseCleanDiv = baseDiv.trim().toLowerCase();
                                let baseMiniLabel = baseDiv.trim();

                                if (baseCleanDiv === 'open') baseMiniLabel = 'O';
                                else if (baseCleanDiv === 'men' || baseCleanDiv === 'mens' || baseCleanDiv === "men's") baseMiniLabel = 'M';
                                else if (baseCleanDiv === 'women' || baseCleanDiv === 'womens' || baseCleanDiv === "women's") baseMiniLabel = 'W';
                                else if (baseCleanDiv.includes('50')) baseMiniLabel = '50+';
                                else if (baseCleanDiv.includes('60')) baseMiniLabel = '60+';
                                else if (baseCleanDiv.includes('23') || baseCleanDiv.includes('u23')) baseMiniLabel = 'U23';
                                else if (baseCleanDiv.includes('master')) baseMiniLabel = 'Mas';
                                else if (baseCleanDiv.includes('cup')) baseMiniLabel = 'Cup';

                                existingEntry.Warning = "[" + baseMiniLabel + "] " + existingEntry.Warning.trim();
                            }

                            // Append the new message only if it isn't an exact duplicate line string
                            if (!existingEntry.Warning.includes(formattedIncomingWarning)) {
                                existingEntry.Warning += " / " + formattedIncomingWarning;
                            }
                        }
                    }
					
					
                } else {

                    // Create a completely new tournament entry token record block
                    dataset.push({
                        "SlotKey": slotKey,
                        "Day": rowDay,
                        "Date": rowDate,
                        "Time": rowTime,
                        "Competition": rowComp,
                        "Event": rowEvent,
                        "Divisions": [rowDiv], // Initialize an array collection
                        "Round": rowRound,
						"Comment": rowComment,
						"Warning": rowWarning
                    });
                }
            }

        }
 dataset.sort((a, b) => {
            if (a.Date !== b.Date) {
                return a.Date.localeCompare(b.Date);
            }
    const getSeconds = (timeStr) => {
                if (!timeStr) return 0;
                const parts = timeStr.split(':');
                const hours = parseInt(parts.at(0), 10) || 0;
                const minutes = parseInt(parts.at(1), 10) || 0;
                const seconds = parseInt(parts.at(2), 10) || 0;
                return (hours * 3600) + (minutes * 60) + seconds;
            };


            return getSeconds(a.Time) - getSeconds(b.Time);
        });
        enableInterface();
    }

    function populateDropdowns() {
        const currentComp = selectedCompetitions;
        const currentEvent = selectedEvents;
        const currentDiv = '';




        const comps = new Set();
        const events = new Set();
        const divisions = new Set();


               dataset.forEach(row => {

                const matchesCurrentDiv =
    selectedDivisions.length === 0 ||
    row.Divisions.some(div =>
        selectedDivisions.includes(div)
    );


                if (
    (
        currentEvent.length === 0 ||
        currentEvent.includes(row.Event)
    ) &&
    matchesCurrentDiv ) {
                if (row.Competition) comps.add(row.Competition);
            }

            if (
    (
        currentComp.length === 0 ||
        currentComp.includes(row.Competition)
    ) &&
    matchesCurrentDiv
) {
    if (row.Event) events.add(row.Event);
}


if (
    (
        currentComp.length === 0 ||
        currentComp.includes(row.Competition)
    ) &&
    (
    currentEvent.length === 0 ||
    currentEvent.includes(row.Event)
)
) {

    if (Array.isArray(row.Divisions)) {

        row.Divisions.forEach(d => {
            if (d) divisions.add(d);
        });

    } else if (row.Division) {

        divisions.add(row.Division);

    }
}

    function resetSelect(elementId, defaultText, sortedItems, currentValue) {
        const dropdown = document.getElementById(elementId);
        dropdown.innerHTML = '<option value="">' + defaultText + '</option>';
        sortedItems.forEach(item => {

function getDivisionIconHtml(divisionText) {
    if (!divisionText) return '';
    
    const cleanText = divisionText.trim().toLowerCase();
    
    // 1. Pink Theme (Women & Over 50's Women)
    if (cleanText === "women") {
        return '<span class="div-icon icon-pink">W</span>';
    }
    if (cleanText.includes("50") && cleanText.includes("women")) {
        return '<span class="div-icon icon-pink">50+</span>';
    }
    
    // 2. Blue Theme (Open & Under 23's)
    if (cleanText === "open") {
        return '<span class="div-icon icon-blue">O</span>';
    }
    if (cleanText === "men") {
        return '<span class="div-icon icon-blue">M</span>';
    }
    if (cleanText.includes("23") || cleanText.includes("u23")) {
        return '<span class="div-icon icon-blue">U23</span>';
    }
    
    // 3. Green Theme (Masters & Over 60's)
    if (cleanText.includes("master")) {
        return '<span class="div-icon icon-green">M</span>';
    }
    if (cleanText.includes("60")) {
        return '<span class="div-icon icon-green">60+</span>';
    }
    if (cleanText === "over 50's" || cleanText === "over 50s") {
        return '<span class="div-icon icon-pink">50+</span>';
    }

    // 4. Yellow Theme (Australia Cup / Cup Divisions)
    if (cleanText.includes("cup")) {
        return '<span class="div-icon icon-yellow">CUP</span>';
    }

    // Fallback if no specific condition matches
    return '';
}
